name: Publish to Official MCP Registry
on:
  push:
    branches: [main]
    paths: ["server.json", ".github/workflows/publish-mcp-registry.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: Publish server.json via GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
