[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orivale-mcp"
version = "1.3.1"
description = "Dual-Rail MCP Server, CrewAI/LangChain Tools & Bridge for Orivale x402 USDC Agent APIs and Apify Store Scrapers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Orivale Open Source", email = "oss@mantissa.id" }]
keywords = ["mcp", "mcp-server", "x402", "usdc", "apify", "n8n", "ai-agents", "rag"]
dependencies = []

[project.urls]
Homepage = "https://ori.mantissa.id/.well-known/x402"
Repository = "https://github.com/tapirro/orivale-agent-mcp"
ApifyStore = "https://apify.com/ultra-liquid"

[project.scripts]
orivale-mcp = "orivale_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orivale_mcp"]
